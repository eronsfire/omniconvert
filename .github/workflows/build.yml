name: Build Android APK & Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev ninja-build ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses
        # O runner ubuntu-latest já traz o Android SDK pré-instalado em
        # /usr/local/lib/android/sdk (ANDROID_HOME). O action
        # android-actions/setup-android tenta instalar o pacote `tools`,
        # que o Google removeu do repositório — por isso foi removido.
        # Basta aceitar as licenças do SDK pré-existente.
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -mindepth 3 -maxdepth 3 -name sdkmanager -type f | sort | tail -n 1)
          echo "Usando sdkmanager: $SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses > /dev/null || true

      - name: Cache Flutter SDK
        uses: actions/cache@v4
        with:
          path: /opt/hostedtoolcache/flutter
          key: flutter-${{ runner.os }}-stable

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true

      - name: Verify Flutter SDK
        run: |
          flutter --version
          which flutter

      - name: Configure Flutter
        run: |
          flutter config --no-enable-linux-desktop
          flutter config --enable-android

      - name: Decode Keystore Secret
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\r\n' | base64 --decode > upload-keystore.jks

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build APK
        run: |
          flet build apk \
            --arch arm64-v8a --arch armeabi-v7a \
            --android-signing-key-store "${{ github.workspace }}/upload-keystore.jks" \
            --android-signing-key-store-password "${{ secrets.KEYSTORE_PASSWORD }}" \
            --android-signing-key-alias "${{ secrets.KEY_ALIAS }}" \
            --android-signing-key-password "${{ secrets.KEY_PASSWORD }}"

          find . -name "*.apk" -type f | head -n 20
          cp "$(find . -path "*/app-release.apk" -type f | head -n 1)" "${{ github.workspace }}/Conversor_Eronsfire_${{ github.ref_name }}.apk"

      - name: Generate SHA256 checksum
        run: |
          cd "${{ github.workspace }}"
          sha256sum "Conversor_Eronsfire_${{ github.ref_name }}.apk" > "Conversor_Eronsfire_${{ github.ref_name }}.apk.sha256"
          cat "Conversor_Eronsfire_${{ github.ref_name }}.apk.sha256"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Conversor_Eronsfire_${{ github.ref_name }}.apk
            Conversor_Eronsfire_${{ github.ref_name }}.apk.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up keystore
        if: always()
        run: rm -f "${{ github.workspace }}/upload-keystore.jks"