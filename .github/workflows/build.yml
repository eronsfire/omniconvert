name: Build Android APK & Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev ninja-build ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Flutter SDK
        uses: actions/cache@v4
        with:
          path: /opt/hostedtoolcache/flutter
          key: flutter-${{ runner.os }}-stable

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure Flutter
        run: |
          flutter config --no-enable-linux-desktop
          flutter config --enable-android

      - name: Decode Keystore Secret
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\r\n' | base64 --decode > upload-keystore.jks

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build APK
        run: |
          cd build/flutter
          flutter pub get
          flet build apk \
            -y \
            --arch arm64-v8a \
            --android-signing-key-store "${{ github.workspace }}/upload-keystore.jks" \
            --android-signing-key-store-password "${{ secrets.KEYSTORE_PASSWORD }}" \
            --android-signing-key-alias "${{ secrets.KEY_ALIAS }}" \
            --android-signing-key-password "${{ secrets.KEY_PASSWORD }}"
          
          mv build/app/outputs/flutter-apk/app-release.apk "${{ github.workspace }}/Conversor_Eronsfire_v${{ github.ref_name }}.apk"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: Conversor_Eronsfire_v${{ github.ref_name }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}